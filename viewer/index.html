<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A3 Sportback 8V — Digital Twin</title>
<style>
  :root { --bg:#0e0f11; --panel:rgba(20,22,26,.82); --fg:#e9eaec; --muted:#9aa0a8; --accent:#c3002f; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg);
    font:14px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; overflow:hidden; }
  #c { position:fixed; inset:0; width:100%; height:100%; display:block; }
  #ui { position:fixed; top:16px; left:16px; max-width:min(320px, calc(100vw - 32px));
    background:var(--panel); backdrop-filter:blur(8px); border-radius:12px; padding:14px 16px; }
  #ui h1 { font-size:15px; margin:0 0 2px; letter-spacing:.02em; }
  #ui p { margin:0 0 10px; color:var(--muted); font-size:12px; }
  .row { display:flex; flex-wrap:wrap; gap:6px; margin:8px 0; }
  button { background:#24272d; color:var(--fg); border:1px solid #33373f; border-radius:8px;
    padding:6px 10px; font:inherit; font-size:12px; cursor:pointer; }
  button.on { border-color:var(--accent); background:#3a1119; }
  label { font-size:12px; color:var(--muted); display:block; margin-top:8px; }
  #status { position:fixed; bottom:16px; left:16px; color:var(--muted); font-size:12px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <h1>Audi A3 Sportback 8V · 2.0 TDI S line</h1>
  <p>Gemelo digital procedural (2013–2016, pre-restyling)</p>
  <label>Cámara</label>
  <div class="row" id="views"></div>
  <label>Pintura</label>
  <div class="row" id="paints"></div>
  <label>Luces</label>
  <div class="row"><button id="lights">Encender luces</button><button id="rotate">Girar</button></div>
</div>
<div id="status">Cargando modelo…</div>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const MODEL = new URLSearchParams(location.search).get('model') || 'a3_sportback_8v.glb';
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x15171a);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(35, 1, 0.02, 200);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.target.set(0, 0.6, 0);

// ground with soft contact shadow
const ground = new THREE.Mesh(new THREE.CircleGeometry(12, 64),
  new THREE.MeshStandardMaterial({ color: 0x2a2c30, roughness: 0.9 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
const sun = new THREE.DirectionalLight(0xffffff, 1.6);
sun.position.set(4, 8, 3); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -4, right: 4, top: 4, bottom: -4 });
scene.add(sun);

// glTF is Y-up: model X forward -> three +X, model +Y (left) -> three -Z
const VIEWS = {
  'Frontal 3/4': [[4.8, 1.5, -3.6], [0, 0.6, 0]],
  'Trasera 3/4': [[-5.0, 1.7, -3.4], [-0.4, 0.6, 0]],
  'Lateral': [[1.3, 0.8, -7.5], [-1.3, 0.6, 0]],
  'Puesto conductor': [[-1.55, 1.12, -0.37], [-0.4, 0.95, -0.3]],
  'Plazas traseras': [[-2.4, 1.15, 0.0], [-0.6, 0.85, 0.0]],
  'Llanta': [[0.4, 0.4, -2.0], [0, 0.32, -0.75]],
};
const PAINTS = { 'Blanco Ibis': 0xf2f2ee, 'Blanco Glaciar met.': 0xe9ebea,
                 'Negro Mito': 0x0b0b0c, 'Rojo Misano': 0xb00d1d };
let paintMats = [], lampMats = [], car;

function setView(name) {
  const [p, t] = VIEWS[name];
  camera.position.set(...p); controls.target.set(...t); controls.update();
  document.querySelectorAll('#views button').forEach(b => b.classList.toggle('on', b.textContent === name));
}
for (const n of Object.keys(VIEWS)) {
  const b = document.createElement('button'); b.textContent = n; b.onclick = () => setView(n);
  document.getElementById('views').appendChild(b);
}
for (const [n, c] of Object.entries(PAINTS)) {
  const b = document.createElement('button'); b.textContent = n;
  b.onclick = () => { paintMats.forEach(m => m.color.setHex(c)); };
  document.getElementById('paints').appendChild(b);
}
let lightsOn = false;
document.getElementById('lights').onclick = (e) => {
  lightsOn = !lightsOn; e.target.classList.toggle('on', lightsOn);
  lampMats.forEach(m => { m.emissive.copy(m.color); m.emissiveIntensity = lightsOn ? 3 : 0; });
};
let spin = false;
document.getElementById('rotate').onclick = (e) => { spin = !spin; e.target.classList.toggle('on', spin); };

const draco = new DRACOLoader();
draco.setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/libs/draco/');
const loader = new GLTFLoader(); loader.setDRACOLoader(draco);
loader.load(MODEL, (gltf) => {
  car = gltf.scene;
  car.traverse(o => {
    if (!o.isMesh) return;
    o.castShadow = o.receiveShadow = true;
    const m = o.material;
    if (!m) return;
    if (m.name === 'Paint_Body') paintMats.push(m);
    if (/^LED_|Gauge_Marks|Needle/.test(m.name)) lampMats.push(m);
    if (/Glass|Lens/.test(m.name)) { m.transparent = true; m.depthWrite = false; }
  });
  scene.add(car);
  document.getElementById('status').textContent = 'Arrastra para orbitar · rueda para zoom';
  setView('Frontal 3/4');
}, (e) => {
  if (e.total) document.getElementById('status').textContent =
    `Cargando modelo… ${(100 * e.loaded / e.total).toFixed(0)} %`;
}, (err) => { document.getElementById('status').textContent = 'Error cargando ' + MODEL; console.error(err); });

function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();
renderer.setAnimationLoop(() => {
  if (spin && car) car.rotation.y += 0.003;
  controls.update(); renderer.render(scene, camera);
});
</script>
</body>
</html>
